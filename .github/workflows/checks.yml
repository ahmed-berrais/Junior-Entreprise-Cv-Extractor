# Runs on every pull request. A red check means: don't merge yet.
name: checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic==2.14.1
      - run: python -m cv_worker.export_schema
        working-directory: worker
      - run: npm run schema:gen
      - run: git diff --exit-code -- shared/profile.schema.json lib/profile/schema.gen.ts
      - run: npm run test:web
      - run: npm run lint
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase db start      # only Postgres, with every migration applied
      - run: supabase test db       # tables, queue and access-rule tests
